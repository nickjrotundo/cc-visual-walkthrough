name: Publish demo report to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - name: Run the walkthrough against the bundled demo app
        env:
          CCWALK_DEMO_USER: demo
          CCWALK_DEMO_PASS: demo123
        run: uv run ccwalk run --config demo/ccwalk.yaml --start-app --out-dir site
      - name: Add index redirect
        run: cp site/report.html site/index.html
      - name: Add privacy policy
        run: cp docs/privacy.html site/privacy.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
